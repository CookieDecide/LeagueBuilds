name: Build and release Tauri client

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (defaults to pushed tag, or v<tauri-version> on manual runs)'
        required: false
      release_details:
        description: 'Optional markdown release notes. If empty, notes are auto-generated for new releases.'
        required: false
      publish_release:
        description: 'If false, run build only and skip GitHub release publishing'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    name: Build Tauri EXE
    outputs:
      release_tag: ${{ steps.versioning.outputs.tag }}
      release_name: ${{ steps.versioning.outputs.release_name }}
      release_version: ${{ steps.versioning.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag and optionally bump versions
        id: versioning
        shell: pwsh
        run: |
          $publishRelease = "${{ github.event.inputs.publish_release }}" -eq "true"
          $tagInput = "${{ github.event.inputs.tag || '' }}".Trim()

          if ($tagInput -ne "") {
            $tag = $tagInput
          } else {
            $currentTauriVersion = (Get-Content "LeagueBuilds_tauri_client/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
            $tag = "v$currentTauriVersion"
          }

          if (-not $tag.StartsWith("v")) {
            $tag = "v$tag"
          }

          if ($publishRelease) {
            if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
              Write-Error "Invalid release tag '$tag'. Expected format vX.Y.Z"
              exit 1
            }

            $targetVersion = $tag.Substring(1)
            $currentVersion = (Get-Content "LeagueBuilds_tauri_client/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version

            function Compare-Semver([string]$a, [string]$b) {
              $pa = $a.Split('.') | ForEach-Object { [int]$_ }
              $pb = $b.Split('.') | ForEach-Object { [int]$_ }
              for ($i = 0; $i -lt 3; $i++) {
                if ($pa[$i] -gt $pb[$i]) { return 1 }
                if ($pa[$i] -lt $pb[$i]) { return -1 }
              }
              return 0
            }

            if ((Compare-Semver $targetVersion $currentVersion) -le 0) {
              Write-Error "Release tag version $targetVersion must be newer than current version $currentVersion"
              exit 1
            }

            $tauriConfigPath = "LeagueBuilds_tauri_client/src-tauri/tauri.conf.json"
            $tauriConfig = Get-Content $tauriConfigPath -Raw | ConvertFrom-Json
            $tauriConfig.version = $targetVersion
            $tauriConfig | ConvertTo-Json -Depth 100 | Set-Content $tauriConfigPath

            $packagePath = "LeagueBuilds_tauri_client/package.json"
            $packageJson = Get-Content $packagePath -Raw | ConvertFrom-Json
            $packageJson.version = $targetVersion
            $packageJson | ConvertTo-Json -Depth 100 | Set-Content $packagePath

            $serverVersionPath = "LeagueBuilds_server/src/version.py"
            $serverVersionContent = Get-Content $serverVersionPath -Raw
            $serverVersionContent = [regex]::Replace($serverVersionContent, 'version\s*=\s*"V[^"]+"', "version = \"V$targetVersion\"")
            Set-Content $serverVersionPath $serverVersionContent

            Write-Host "Bumped versions to $targetVersion for release build."
          } else {
            if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
              Write-Host "Build-only run: skipping release tag validation for '$tag'."
              $targetVersion = ((Get-Content "LeagueBuilds_tauri_client/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version)
            } else {
              $targetVersion = $tag.Substring(1)
            }
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$targetVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_name=Tauri Client $tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: LeagueBuilds_tauri_client/package-lock.json

      - name: Install frontend dependencies
        working-directory: LeagueBuilds_tauri_client
        shell: pwsh
        run: npm ci

      - name: Build Tauri application
        working-directory: LeagueBuilds_tauri_client
        shell: pwsh
        run: npm run tauri build

      - name: Prepare release executable
        shell: pwsh
        run: |
          $builtExe = "LeagueBuilds_tauri_client/src-tauri/target/release/leaguebuilds_tauri_client.exe"
          if (!(Test-Path $builtExe)) {
            Write-Error "Expected executable not found: $builtExe"
            exit 1
          }

          $releaseExe = Join-Path $env:RUNNER_TEMP "LeaguBuilds.exe"
          Copy-Item $builtExe $releaseExe -Force

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-client-exe
          path: ${{ runner.temp }}/LeaguBuilds.exe

  release:
    runs-on: ubuntu-latest
    needs: build
    name: Publish release
    if: ${{ github.event.inputs.publish_release == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: tauri-client-exe
          path: release-asset

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          asset="release-asset/LeaguBuilds.exe"
          if [[ ! -f "$asset" ]]; then
            echo "Missing release asset: $asset"
            exit 1
          fi

          details='${{ github.event.inputs.release_details || '' }}'

          if gh release view "${{ needs.build.outputs.release_tag }}" > /dev/null 2>&1; then
            if [[ -n "$details" ]]; then
              gh release edit "${{ needs.build.outputs.release_tag }}" \
                --title "${{ needs.build.outputs.release_name }}" \
                --notes "$details"
            else
              gh release edit "${{ needs.build.outputs.release_tag }}" \
                --title "${{ needs.build.outputs.release_name }}"
            fi
            gh release upload "${{ needs.build.outputs.release_tag }}" "$asset" --clobber
          else
            if [[ -n "$details" ]]; then
              gh release create "${{ needs.build.outputs.release_tag }}" "$asset" \
                --title "${{ needs.build.outputs.release_name }}" \
                --notes "$details"
            else
              gh release create "${{ needs.build.outputs.release_tag }}" "$asset" \
                --title "${{ needs.build.outputs.release_name }}" \
                --generate-notes
            fi
          fi
