name: Build and release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release (e.g. v1.2.3). If omitted when manually dispatching, the workflow will still run but release creation may use run ID.'
        required: false
      in_repo:
        description: 'If true, build will put artifacts inside the repository (src/dist) instead of runner temp. Default: true'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    name: Build EXE
    outputs:
      artifact-name: LeagueBuilds-client-exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Build client EXE (PowerShell script — inside repo)
        if: ${{ github.event.inputs.in_repo != 'false' }}
        working-directory: LeagueBuilds_client
        shell: pwsh
        run: |
          # Build into repository's src/dist (safe if dist/ and build/ are in .gitignore)
          ./ci/build-windows.ps1 -InRepo

      - name: Build client EXE (PowerShell script — outside repo)
        if: ${{ github.event.inputs.in_repo == 'false' }}
        working-directory: LeagueBuilds_client
        shell: pwsh
        run: |
          # Ensure a build location outside the repo (runner temp) so repo remains clean
          $out = Join-Path $env:RUNNER_TEMP 'LeagueBuilds-dist'
          ./ci/build-windows.ps1 -OutputDir $out

      - name: Upload EXE as workflow artifact (in-repo)
        if: ${{ github.event.inputs.in_repo != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: LeagueBuilds-client-exe
          path: LeagueBuilds_client/src/dist/LeagueBuilds.exe

      - name: Upload EXE as workflow artifact (outside repo)
        if: ${{ github.event.inputs.in_repo == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: LeagueBuilds-client-exe
          path: ${{ runner.temp }}/LeagueBuilds-dist/LeagueBuilds.exe

  release:
    runs-on: ubuntu-latest
    needs: build
    # This environment should be protected by GitHub to require manual approval/review.
    environment: release-approval
    name: Create Release (requires approval)
    steps:
      - name: Download built EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: LeagueBuilds-client-exe

      - name: Verify exe exists
        run: |
          if [ ! -f "./LeagueBuilds-client-exe/LeagueBuilds.exe" ]; then echo "exe not found"; exit 1; fi

      - name: Create or update GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # prefer manual 'tag' input when available, otherwise use the tag that triggered the push
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          release_name: ${{ github.event.inputs.tag || github.ref_name || format('build-{0}', github.run_number) }}
          body: |
            Automated build produced by GitHub Actions (run ${{ github.run_id }})

            ## Code signing policy

            Free code signing provided by SignPath.io, certificate by SignPath Foundation.

            Privacy policy: [PRIVACY.md](https://github.com/CookieDecide/LeagueBuilds/blob/main/PRIVACY.md)

            Project roles:
            - Committers and reviewers: CookieDecide
            - Approvers: CookieDecide

            Signing rules:
            - Only release artifacts built from this repository are signed.
            - Only binaries produced by the LeagueBuilds build pipeline are included in signed packages.
            - Version numbers must match across all signed binaries in a release.
            - Third-party libraries may be included as unsigned upstream components when required by the package format.
          draft: false
          prerelease: false

      - name: Upload EXE to GitHub release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./LeagueBuilds-client-exe/LeagueBuilds.exe
          asset_name: LeagueBuilds-Client-${{ github.event.inputs.tag || github.ref_name || github.run_number }}.exe
          asset_content_type: application/octet-stream
